server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy REST + WebSocket to the FastAPI backend.
  location /ws {
    proxy_pass http://backend:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
  }

  location / {
    # Disable browser cache for the dashboard assets so users always pull the
    # freshly built HTML/CSS/JS after a `docker compose up --build frontend`.
    # Without this, Chrome aggressively caches index.html / app.js / styles.css
    # and shows the old layout even after the container is rebuilt.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
    try_files $uri /index.html;
  }
}
